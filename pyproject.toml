[project]
name = "emulator-ui"
version = "0.1.0"
description = "Emulator UI: a web console to browse and interact with the resources in a local AWS Emulator"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Deeptaroop Mojumdar", email = "deeptaroop2015@gmail.com" }]
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.urls]
Homepage = "https://github.com/D33ptar00p/emulator-ui"
Repository = "https://github.com/D33ptar00p/emulator-ui"
Issues = "https://github.com/D33ptar00p/emulator-ui/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-html>=4.2.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emulator_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # keep compact "a b c".split() word lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"assets/brand/generate.py" = ["E501"]  # inline SVG markup

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.File", "fastapi.Form", "fastapi.Query"]
