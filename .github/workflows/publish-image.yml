# Build the console image for amd64 + arm64 and publish it to ghcr.io/d33ptar00p/emulator-ui.
# Runs on version tags (v1.2.3) or manually. Actions are pinned to commit SHAs.
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/emulator-ui

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Emulator UI
            org.opencontainers.image.description=A web console for AWS Emulator: browse and drive every emulated service locally
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          annotations: |
            org.opencontainers.image.title=Emulator UI
            org.opencontainers.image.description=A web console for AWS Emulator: browse and drive every emulated service locally
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/console.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
