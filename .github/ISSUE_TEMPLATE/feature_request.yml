name: Feature request
description: Suggest an idea or improvement for Emulator UI
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mock-ups or screenshots are welcome.
    validations:
      required: true
  - type: input
    id: services
    attributes:
      label: Which services does this involve?
      placeholder: e.g. DynamoDB, Step Functions, all services
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this (see CONTRIBUTING.md)
